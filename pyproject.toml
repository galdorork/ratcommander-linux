[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ratcommander"
version = "0.1.3"
description = "Linux editor for the 12 thumb buttons of a supported side-grid gaming mouse"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
device = ["hidapi>=0.14"]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
ratcommander = "aerocommand.__main__:main"
aerocommand = "aerocommand.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
